<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>دیدگستر | فروشگاه تجهیزات امنیتی</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/static/style.css"></head>
<body><header class="top"><div><small>فروشگاه هوشمند</small><h1>دیدگستر</h1><p>تجهیزات دوربین، دزدگیر و شبکه</p></div><div class="logo">DG</div></header>
<main id="shopView"><section class="search"><input id="search" placeholder="جست‌وجوی محصول..."></section><nav id="categories" class="categories"></nav>
<section class="welcome"><b id="welcome">به دیدگستر خوش آمدید</b><span id="role">در حال دریافت اطلاعات حساب...</span></section>
<section><div class="section-title"><h2>محصولات فروشگاه</h2><span id="count"></span></div><div id="products" class="products"></div></section></main>
<section id="adminView" class="admin hidden"><div class="admin-head"><div><small>مدیریت فروشگاه</small><h2>پنل مدیریت دیدگستر</h2></div><button class="secondary" id="backShop">مشاهده فروشگاه</button></div>
<nav class="admin-tabs"><button data-tab="dashboard" class="selected">داشبورد</button><button data-tab="orders">سفارش‌ها</button><button data-tab="customers">مشتریان</button><button data-tab="products">محصولات</button><button data-tab="categories">دسته‌بندی</button><button data-tab="discounts">کد تخفیف</button></nav>
<div id="adminContent"></div></section>
<button id="adminButton" class="admin-fab hidden">⚙ مدیریت</button>
<button id="cartButton" class="cart-button">سبد خرید <span id="cartCount">۰</span></button>
<dialog id="cartDialog"><div class="dialog-head"><h2>سبد خرید</h2><button class="x" id="closeCart">×</button></div><div id="cartItems"></div>
<div class="total"><span>جمع کل</span><b id="cartTotal">۰ تومان</b></div><input id="discountCode" placeholder="کد تخفیف (اختیاری)">
<form id="orderForm"><input name="customer_name" required placeholder="نام و نام خانوادگی"><input name="phone" required placeholder="شماره تماس"><textarea name="address" required placeholder="آدرس یا توضیحات تحویل"></textarea><button class="primary" type="submit">ثبت سفارش</button></form><p id="orderResult" class="result"></p></dialog>
<div id="toast" class="toast"></div><script src="/static/app.js"></script></body></html>
